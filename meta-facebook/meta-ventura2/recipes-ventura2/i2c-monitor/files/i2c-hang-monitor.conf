# Controller base address (AST2600: i2c0=0x1e78a080, +0x80 each, i2c4=0x1e78a280)
BASE=0x1e78a280

# BMC local MCTP EID
LOCAL_EID=10

# Poll interval, and identical samples needed before declaring a wedge.
INTERVAL=5
CONFIRM=3

# Pause after a recovery.
COOLDOWN=30

# Check MCTP/PLDM health every N polls (12 x 5s = 1 min).
# Nothing is logged unless the health state actually changes.
SVC_CHECK_EVERY=12

# If MCTP/PLDM stay broken, retry the repair only every N polls
# (120 x 5s = 10 min) so a permanent fault does not restart the daemons
# or fill the journal every minute.
SVC_RETRY=120

# Refresh the healthy register snapshot every N polls (60 x 5s = 5 min).
RESNAP_EVERY=60

# Fall back to a driver unbind/bind if the register reset does not work.
ENABLE_REBIND=1

MCTP_SERVICE=mctpd.service
PLDM_SERVICE=pldmd.service

# Known-good register values, used only if the snapshot reads back as zero
# because the controller was already broken when the monitor started.
FALLBACK_CTRL=00020003
FALLBACK_SCMD=00070000
FALLBACK_IER=00012000

# Seconds to wait for mctpd to discover the E810 after a restart.
DISCOVERY_WAIT=45

# pldmd can give up on the terminus while the EID is missing, and that is
# not visible from the MCTP layer, so restart it after restoring the EID.
# Set to 0 to skip.
RESTART_PLDM_ON_EID_FIX=1

# Require this specific remote EID (the E810). Leave empty to accept any
# remote endpoint.
PEER_EID=11
