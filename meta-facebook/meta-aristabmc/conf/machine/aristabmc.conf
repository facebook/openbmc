#@TYPE: Machine
#@NAME: aristabmc
#@DESCRIPTION: Machine configuration for Facebook aristabmc

require conf/machine/include/ast2700.inc
require conf/machine/include/fb-fboss.inc
require conf/machine/include/mtd-ubifs.inc
require conf/machine/include/tpm2.inc

SERIAL_CONSOLES:aristabmc = "9600;ttyS12"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-aspeed-sdk"
PREFERRED_PROVIDER_u-boot = "u-boot-aspeed-sdk"
PREFERRED_VERSION_u-boot-aspeed-sdk = "v2023.10%"
PREFERRED_PROVIDER_u-boot-fw-utils = "libubootenv"

BBMASK:append = " meta-aspeed/recipes-bsp/u-boot/u-boot-tools_2019.04.bb"

# Select wedge-eeprom-0.2 to support Meta EEPROM format v6.
PREFERRED_VERSION_wedge-eeprom = "0.2"
PREFERRED_VERSION_libwedge-eeprom = "0.2"

EXTRA_IMAGE_FEATURES:append = " image-meta"


# Aristabmc supplies AST2700-specific Zephyr firmware recipes.  Do not parse
# the LF OpenBMC Zephyr recipes also exposed by the common layer.
BBMASK:append = " common/lfopenbmc/zephyrcore/"

#
# Boot chain: BootMCU (Zephyr on RISC-V Ibex)
#
PREFERRED_PROVIDER_virtual/bootmcu = "zephyr-aspeed-bootmcu"
BOOTMCU_FW_BINARY = "ast2700-mcu-runtime.bin"
ZEPHYR_BOARD_BOOTMCU = "ast2700_evb/ast2700/bootmcu"

# Manifest stage-1 firmware
MACHINE_FEATURES:append = " ast-ssp ast-tsp"
MACHINEOVERRIDES .= ":ast-ssp:ast-tsp"
PREFERRED_PROVIDER_virtual/ssp = "zephyr-aspeed-ssp"
PREFERRED_PROVIDER_virtual/tsp = "zephyr-aspeed-tsp"
ZEPHYR_BOARD_SSP = "ast2700_evb/ast2700/ssp_tsp"
ZEPHYR_BOARD_TSP = "ast2700_evb/ast2700/tsp"

ZEPHYR_TOOLCHAIN_VARIANT = "zephyr"
PREFERRED_VERSION_zephyr-sdk-native = "0.16.9"
PREFERRED_VERSION_zephyr-kernel ??= "3.7.0"

#
# G7 image class — merges Caliptra + BootMCU + U-Boot into composite flash
#
IMAGE_CLASSES:append = " image_types_phosphor_aspeed_g7"

# The G7 image class consumes the Caliptra manifest image as the bootloader
# payload.  This machine-level value is therefore visible to both the image
# recipe and aspeed-image-manifest.
CALIPTRA_MANIFEST_FLASH_IMAGE ?= "ast2700-manifest-flash.bin"


UBOOT_MACHINE:aristabmc = "evb-ast2700_defconfig"
UBOOT_DEVICETREE = "aspeed-bmc-facebook-aristabmc"

KERNEL_DEVICETREE = "aspeed/aspeed-bmc-facebook-aristabmc.dtb"
PREFERRED_VERSION_linux-aspeed = "6.18.%"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-i2c-dev-sysfs"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-module-cpld"
