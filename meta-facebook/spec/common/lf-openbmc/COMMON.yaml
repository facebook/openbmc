User Interface:
  Redfish:
    file: redfish.md
    priority: P1
    short: Provide a Redfish interface for all remote-management APIs.
    functionality:
      - name: AccountService
        tests:
          - framework: Robot
            id: IPMI_Redfish_User
            description: A suite that tests Redfish for user management.
          - framework: Robot
            id: Redfish_Privilege_Registry
            description: A suite to test Redfish privilege registry with various users such as test, admin, operator, readonly, patched.
          - framework: Robot
            id: User_Account
            description: Test suite for verifying Redfish admin, readonly operation user accounts.
          - framework: Robot
            id: BMC_Connections
            description: Test suite for Connections and authentication module stability tests.
          - framework: Robot
            id: BMC_Expire_Password
            description: Test suite for testing root user expire password.
      - name: SessionService
        tests:
          - framework: Robot
            id: Sessions_Management
            description: Test Redfish SessionService.
          - framework: Robot
            id: Service_Root
            description: Suite to Test Redfish to verify responses for SessionService and Hypermedia.
      - name: Chassis
        tests:
          - framework: Robot
            id: Thermal_Ambient_Temperatures
            description: Test suite for verifying getting the systems thermal records for temperature.
      - name: Chassis/.../Sensors
        tests:
          - framework: Robot
            id: Verify_Redfishtool_Sensor_Commands
            description: Verify redfishtool's sensor commands.
          - framework: Robot
            id: Sensor_Monitoring
            description: Test suite for verifying Redfish sensor monitoring.
          - framework: Robot
            id: BMC_Collect_Sensors
            description: Test suite for verifying BMC server health, collect sensors.
      - name: Systems
        tests:
          - framework: Robot
            id: Redfishtool_Local_User
            description: Suite to test local user management.
          - framework: Robot
            id: Verify_Current_Power_Mode_Setting
            description: Verify the current power mode setting.
          - framework: Robot
            id: Verify_Allowable_Power_Mode_Settings
            description: Check the allowable power modes are set successfully at runtime.
          - framework: Robot
            id: Verify_Allowable_Power_Mode_Settings_Switch_At_Runtime
            description: Check the allowable power modes are set successfully at runtime.
          - framework: Robot
            id: Boot_Devices
            description: The suite test various boot types with boot source.
          - framework: Robot
            id: Led_Indicator_Asserted
            description: Test suite for verifying the indicator LEDs on the system can set the assert
          - framework: Robot
            id: Systems_Inventory
            description: Test suite for verifying inventory of hardware FRUs under redfish.
      - name: Systems/.../LogServices
        tests:
          - framework: Robot
            id: Event_Logging
            description: Test suite for verifying Inventory of hardware resources under systems.
          - framework: Robot
            id: Post_Codes
            description: Test suite to verify BIOS POST code log entries.
          - framework: Robot
            id: Event_Service
            description: Test suite for verifying Redfish event service subscription function.
      - name: Managers/.../LogServices
        tests:
          - framework: Robot
            id: BMC_Dumps
            description: Test suite for verifying BMC dump functionality of OpenBMC.
          - framework: Robot
            id: Test_XIT
            description: This suite is to run some test at the end of execution. It checks the LogService for any errors.
      - name: Managers/.../EthernetInterfaces
        tests:
          - framework: N/A
      - name: Managers/.../NetworkProtocol
        tests:
          - framework: Robot
            id: BMC_Network_Protocol
            description: Test suite for verifying NTP configuration and verification.
          - framework: Robot
            id: Verify_Server_Certificate_View_Via_Openssl
            description: Verify server certificate via openssl command.
          - framework: Robot
            id: Install_Server_Certificate_Using_Redfishtool_And_Verify_Via_OpenSSL
            description: Install server certificate using Redfishtool and verify via OpenSSL.
      - name: Managers/.../Actions/Manager.Reset
        tests:
          - framework: Robot
            id: Managers_BMC
            description: Test suite for verifying Test BMC Manager functionality.
      - name: TaskService
        tests:
          - framework: Robot
            id: Tasks_Service
            description: Test suite for verifying Test task service and tasks URI functionality of OpenBMC.
      - name: UpdateService
        tests:
          - framework: Robot
            id: Bmc_Code_Update
            description: Test suite verifying update the BMC code on a target BMC via Redifsh.
      - name: UpdateService/FirmwareInventory
        tests:
          - framework: Robot
            id: Firmware_Inventory
            description: Verify that Redfish software inventory can be collected.
      - name: BMC time can be managed via Redfish
        tests:
          - framework: Robot
            id: Managers_BMC_Time
            description: Test suite for verifying BMC manager time functionality.
