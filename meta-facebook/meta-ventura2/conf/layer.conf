# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBMASK += "common/recipes-lib/peci/libpeci_git.bb"

BBFILE_COLLECTIONS += "fb-ventura2-layer"
BBFILE_PATTERN_fb-ventura2-layer := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_fb-ventura2-layer := "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone"
