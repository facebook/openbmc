# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "fbdarwin"
BBFILE_PATTERN_fbdarwin = "^${LAYERDIR}/"
BBFILE_PRIORITY_fbdarwin = "25"

LAYERSERIES_COMPAT_fbdarwin = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
DISTRO_FEATURES_OPTED_OUT += "sysvinit"
