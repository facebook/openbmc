# CONFIG_FB is not set
# CONFIG_INPUT_MOUSE is not set
# CONFIG_WIRELESS is not set
# CONFIG_WLAN is not set

# CONFIG_PCI is not set
# CONFIG_ASPEED_HOST_BMC_DEV is not set
# CONFIG_ASPEED_MCTP is not set
# CONFIG_ASPEED_PCIE_MMBI is not set

CONFIG_HAVE_CLK=y
CONFIG_OF=y
CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y

# aspeed-adc driver
CONFIG_COMMON_CLK=y
CONFIG_ASPEED_ADC=y

# devmem
CONFIG_DEVMEM=y

# USB EHCI & UHCI Core
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_HCD_PLATFORM=y
CONFIG_USB_UHCI=y
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_UHCI_SUPPORT_NON_PCI_HC=y
CONFIG_USB_UHCI_PLATFORM=y
CONFIG_USB_UHCI_ASPEED=y

# USB UART
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_CONSOLE=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_ACM=y

# REGULATOR
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# IPMI & IPMB
CONFIG_IPMI_HANDLER=y
CONFIG_IPMI_DEVICE_INTERFACE=y
CONFIG_IPMB_DEVICE_INTERFACE=y

# I2C drivers
CONFIG_I2C=y
CONFIG_I2C_SLAVE=y

# Aspeed SGPIO
CONFIG_GPIO_ASPEED_SGPIO=y

# Hwmon Sensors
CONFIG_PMBUS=y
CONFIG_I2C_MUX_PCA954x=y
CONFIG_SENSORS_INA238=y
CONFIG_SENSORS_INA2XX=y
CONFIG_SENSORS_LTC4286=y
CONFIG_SENSORS_MAX31790=y
CONFIG_SENSORS_XDP710=y
CONFIG_SENSORS_ISL28022=y
CONFIG_SENSORS_MP2993=y
CONFIG_SENSORS_MP9941=y
CONFIG_SENSORS_XDPE152=y
CONFIG_SENSORS_ADC128D818=y
CONFIG_TI_ADS1015=y
CONFIG_SENSORS_NCT7363=y
CONFIG_SENSORS_LM90=y
CONFIG_SENSORS_TDA38640=y
CONFIG_SENSORS_TMP401=y

# IIO Sensors
CONFIG_MAX1363=y
CONFIG_AD5446=y
CONFIG_LTC2309=y 

# EEPROM & GPIO
CONFIG_EEPROM_AT24=y
CONFIG_GPIO_PCA953X=y

# Enable loadable module
CONFIG_MODULES=y

# Aspeed Ethernet
CONFIG_PHY_ASPEED_SGMII=y

# Aspeed OTP
CONFIG_AST2700_OTP=y

# SPI GPIO
CONFIG_SPI_GPIO=y

# PECI
CONFIG_PECI=y
CONFIG_PECI_ASPEED=y
CONFIG_PECI_CPU=y
CONFIG_AUXILIARY_BUS=y
CONFIG_SENSORS_PECI=y
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y

# RTC
CONFIG_RTC_DRV_PCF8563=y
