# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qemux86-git"
BBFILE_PATTERN_qemux86-git = "^${LAYERDIR}/"
BBFILE_PRIORITY_qemux86-git = "20"

LAYERSERIES_COMPAT_qemux86-git = "wrynose whinlatter walnascar styhead scarthgap nanbield kirkstone dunfell"
