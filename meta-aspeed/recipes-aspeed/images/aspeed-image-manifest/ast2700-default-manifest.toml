# AST2700 A1 Default Manifest Configuration

[manifest_config]
version = 1
flags = 0
security_version = 1

[vendor_fw_key_config]
# Leave commented for unsigned/development build
# For production, add signing keys here
# ecc_pub_key = "vnd-fw-ecc-pubk.pem"
# ecc_priv_key = "vnd-fw-ecc-prvk.pem"

[vendor_man_key_config]
# Leave commented for unsigned/development build
# ecc_pub_key = "vnd-man-ecc-pubk.pem"
# ecc_priv_key = "vnd-man-ecc-prvk.pem"

[owner_fw_key_config]
# Leave commented for unsigned/development build
# ecc_pub_key = "own-fw-ecc-pubk.pem"
# ecc_priv_key = "own-fw-ecc-prvk.pem"

[owner_man_key_config]
# Leave commented for unsigned/development build
# ecc_pub_key = "own-man-ecc-pubk.pem"
# ecc_priv_key = "own-man-ecc-prvk.pem"

[image_runtime_list]
caliptra_file = "caliptra-fw.bin"
mcu_file = "zephyr-aspeed-bootmcu.bin"

[[image_metadata_list]]
file = "zephyr-aspeed-bootmcu.bin"
source = 1
fw_id = 1
ignore_auth_check = false
load_stage = 0

# DDR4 PMU training firmware
[[image_metadata_list]]
file = "ddr4_pmu_train_imem.bin"
source = 1
fw_id = 2
ignore_auth_check = false
load_stage = 0

[[image_metadata_list]]
file = "ddr4_pmu_train_dmem.bin"
source = 1
fw_id = 3
ignore_auth_check = false
load_stage = 0

[[image_metadata_list]]
file = "ddr4_2d_pmu_train_imem.bin"
source = 1
fw_id = 4
ignore_auth_check = false
load_stage = 0

[[image_metadata_list]]
file = "ddr4_2d_pmu_train_dmem.bin"
source = 1
fw_id = 5
ignore_auth_check = false
load_stage = 0

# DDR5 PMU training firmware
[[image_metadata_list]]
file = "ddr5_pmu_train_imem.bin"
source = 1
fw_id = 6
ignore_auth_check = false
load_stage = 0

[[image_metadata_list]]
file = "ddr5_pmu_train_dmem.bin"
source = 1
fw_id = 7
ignore_auth_check = false
load_stage = 0

# DisplayPort firmware
[[image_metadata_list]]
file = "dp_fw.bin"
source = 1
fw_id = 8
ignore_auth_check = false
load_stage = 0

# UEFI firmware
[[image_metadata_list]]
file = "uefi_ast2700.bin"
source = 1
fw_id = 9
ignore_auth_check = false
load_stage = 0

# ARM Trusted Firmware (loaded by BootMCU, load_stage = 1)
[[image_metadata_list]]
file = "trusted-firmware-a/bl31.bin"
source = 1
fw_id = 10
ignore_auth_check = false
load_stage = 1

# OP-TEE OS
[[image_metadata_list]]
file = "optee/tee-raw.bin"
source = 1
fw_id = 11
ignore_auth_check = false
load_stage = 1

# U-Boot
[[image_metadata_list]]
file = "u-boot.bin"
source = 1
fw_id = 12
ignore_auth_check = false
load_stage = 1

# SSP (Secondary Service Processor)
[[image_metadata_list]]
file = "zephyr-aspeed-ssp.bin"
source = 1
fw_id = 13
ignore_auth_check = false
load_stage = 1

# TSP (Tertiary Service Processor)
[[image_metadata_list]]
file = "zephyr-aspeed-tsp.bin"
source = 1
fw_id = 14
ignore_auth_check = false
load_stage = 1
